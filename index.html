<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Business Creation</title>
    <!-- 🌐 Imports the clean, wide font layout from Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f3f4f6;
            color: #111827;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }
        .top-banner {
            width: 100%;
            max-width: 450px;
            margin-top: 30px;
            display: flex;
            justify-content: center;
        }
        .top-banner img {
            width: 85%;
            height: auto;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .container {
            text-align: center;
            max-width: 650px;
            width: 90%;
            padding: 40px 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
            margin: 30px 0;
        }
        
        /* 🔤 MATCHES THE OXIGEN FONT STYLE */
        h1 { 
            font-family: 'Syncopate', sans-serif;
            font-size: 1.6rem; 
            margin-bottom: 30px; 
            line-height: 1.6; 
            text-transform: uppercase; 
            letter-spacing: 4px; /* Creates the premium minimal look */
            color: #111827;
        }
        
        .pricing-cards {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .card {
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 24px;
            width: 200px;
            background: #ffffff;
        }
        .price { font-size: 2rem; font-weight: bold; margin: 15px 0; }
        button {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            letter-spacing: 1px;
        }
        button:hover { background-color: #4338ca; }

        .bottom-section {
            text-align: center;
            max-width: 600px;
            width: 90%;
            margin-top: 10px;
            margin-bottom: 25px;
        }
        
        /* 🔤 Applies matching typography details to the secondary headline */
        .bottom-text {
            font-family: 'Syncopate', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: #1f2937;
            line-height: 1.5;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .bottom-banner {
            width: 100%;
            max-width: 450px;
            margin-bottom: 50px;
            display: flex;
            justify-content: center;
        }
        .bottom-banner img {
            width: 85%;
            height: auto;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>

    <div class="top-banner">
        <img src="https://postimg.cc" alt="Creative Mind AI">
    </div>

    <div class="container">
        <h1>create a business instantly explain your idea and in seconds your fully functional webpage ready to make sales in seconds</h1>

        <div class="pricing-cards">
            <div class="card">
                <h3>Weekly Pass</h3>
                <div class="price">$6</div>
                <p>Billed every 7 days</p>
                <button onclick="checkout('price_1UGYMR7UjmmUoWdKxBnnpLgu')">Subscribe</button>
            </div>

            <div class="card">
                <h3>Monthly Pro</h3>
                <div class="price">$20</div>
                <p>Billed monthly</p>
                <button onclick="checkout('price_1UGYSY7UjmmUoWdK0HZ8rmig')">Subscribe</button>
            </div>
        </div>
    </div>

    <div class="bottom-section">
        <p class="bottom-text">AI generator to make your dreams reality</p>
    </div>

    <div class="bottom-banner">
        <img src="https://postimg.cc" alt="Idea Without Action Is Nothing">
    </div>

    <script>
        async function checkout(priceId) {
            try {
                const response = await fetch('/create-checkout-session', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ priceId: priceId })
                });
                const session = await response.json();
                if (session.url) {
                    window.location.href = session.url;
                } else {
                    alert('Error creating checkout session. Please check your credentials.');
                }
            } catch (error) {
                console.error('Frontend Error:', error);
            }
        }
    </script>
</body>
</html>
