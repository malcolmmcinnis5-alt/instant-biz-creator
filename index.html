<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Your Subscription</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f6f9; margin: 0; }
        .pricing-container { display: flex; gap: 20px; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; width: 200px; }
        h3 { margin-top: 0; color: #333; }
        .price { font-size: 24px; font-weight: bold; color: #111; margin: 15px 0; }
        button { background-color: #6772e5; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; }
        button:hover { background-color: #5469d4; }
    </style>
</head>
<body>

    <div class="pricing-container">
        <!-- 7 Day Plan -->
        <div class="card">
            <h3>Short Term Plan</h3>
            <div class="price">$6 <span style="font-size:14px; color:#666;">/ 7 days</span></div>
            <button onclick="checkout('weekly')">Subscribe Now</button>
        </div>

        <!-- Monthly Plan -->
        <div class="card">
            <h3>Monthly Plan</h3>
            <div class="price">$20 <span style="font-size:14px; color:#666;">/ month</span></div>
            <button onclick="checkout('monthly')">Subscribe Now</button>
        </div>
    </div>

    <script>
        async function checkout(plan) {
            try {
                const response = await fetch('https://onrender.com', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ planType: plan })
                });
                
                const data = await response.json();
                if (data.url) {
                    window.location.href = data.url; // Send customer to Stripe Checkout Page
                } else {
                    alert('Error creating checkout session.');
                }
            } catch (err) {
                console.error('Frontend Error:', err);
                alert('Could not connect to payment server.');
            }
        }
    </script>
</body>
</html>
