<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Business Creation</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f9fafb;
            color: #111827;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            max-width: 600px;
            padding: 40px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h1 { font-size: 2.5rem; margin-bottom: 10px; }
        p { color: #4b5563; font-size: 1.1rem; margin-bottom: 30px; }
        .pricing-cards {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
        }
        .card {
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 24px;
            width: 200px;
            transition: border-color 0.2s;
        }
        .card:hover { border-color: #4f46e5; }
        .price { font-size: 2rem; font-weight: bold; margin: 15px 0; }
        button {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            width: 100%;
        }
        button:hover { background-color: #4338ca; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Instant Business Creator</h1>
        <p>Launch your fully automated business website in seconds.</p>

        <div class="pricing-cards">
            <div class="card">
                <h3>Weekly Pass</h3>
                <div class="price">$6</div>
                <p>Billed every 7 days</p>
                <!-- ⚠️ REPLACE 'price_WEEKLY_ID' with your Stripe Price ID later -->
                <button onclick="checkout('price_WEEKLY_ID')">Subscribe</button>
            </div>

            <div class="card">
                <h3>Monthly Pro</h3>
                <div class="price">$20</div>
                <p>Billed monthly</p>
                <!-- ⚠️ REPLACE 'price_MONTHLY_ID' with your Stripe Price ID later -->
                <button onclick="checkout('price_MONTHLY_ID')">Subscribe</button>
            </div>
        </div>
    </div>

    <script>
        async function checkout(priceId) {
            try {
                const response = await fetch('/create-checkout-session', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ priceId: priceId })
                });
                const session = await response.json();
                if (session.url) {
                    window.location.href = session.url;
                } else {
                    alert('Error creating checkout session.');
                }
            } catch (error) {
                console.error('Frontend Error:', error);
            }
        }
    </script>
</body>
</html>
